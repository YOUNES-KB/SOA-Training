type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}
type QueryResolver {
    allUEs: [UniteEnseignement]
}


type MutationResolver {
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    modifierUniteEnseignement(
        code: Int!
        domaine: String
        responsable: String
        credits: Int
        semestre: Int
    ): Boolean

    supprimerUniteEnseignement(
        code: Int!
    ): Boolean


}
schema {
    query: QueryResolver
    mutation: MutationResolver
}
